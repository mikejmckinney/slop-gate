# Copy to .github/workflows/slop-audit.yml in a consumer repo, then run it from
# the Actions tab ("Run workflow"). It reports existing debt across the whole
# repo without blocking anything.
name: slop-audit

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Check families to run: prose,code,media (blank = all)"
        required: false
        default: ""

permissions: {}

jobs:
  audit:
    name: slop-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # The audit reads only the working tree, so a shallow checkout is enough.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mikejmckinney/slop-gate/audit@v1
        with:
          only: ${{ inputs.only }}
