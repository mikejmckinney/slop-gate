# Copy to .github/workflows/slop-footer.yml in a consumer repo. It removes tool
# attribution footers from comments and issue bodies as they're posted or
# edited. Run it from the Actions tab ("Run workflow") to clean up everything
# already in the repo: leave "apply" off first to see the counts.
name: slop-footer

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      apply:
        description: "Edit every PR description, issue body and comment with a footer (off: count only)"
        type: boolean
        default: false

permissions: {}

jobs:
  footer:
    name: slop-footer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # No checkout: the action edits text through the GitHub API only.
      - uses: mikejmckinney/slop-gate/footer@v1
        with:
          apply: ${{ inputs.apply || false }}
