# Default Vale config shipped with slop-gate. Consumers may copy and adjust.
StylesPath = styles
MinAlertLevel = warning

[*.{md,mdx,txt,rst}]
BasedOnStyles = SlopGate
# Words quoted as examples ("avoid 'robust'") are mentions, not usage.
TokenIgnores = ("[^"\n]+?"), (“[^”\n]+?”)

# Code comments and docstrings get the lighter tier: residue and inflated
# claims still block, cadence and transition rules do not apply.
[*.{py,js,mjs,cjs,ts,tsx,jsx,go,rs,sh,java,cs,rb}]
BasedOnStyles = SlopGate
SlopGate.EmDashDensity = NO
SlopGate.FillerTransitions = NO
SlopGate.OverQualified = NO
SlopGate.BothSides = NO
SlopGate.TypesNotSpecifics = NO
SlopGate.PrestigeLabels = NO
SlopGate.CopulaAvoidance = NO
SlopGate.AIVocabularyStacked = NO
SlopGate.PrestigeStacked = NO
