# Reusable workflow. Consumer repos call it from a pull_request workflow:
#
#   jobs:
#     slop-gate:
#       uses: mikejmckinney/slop-gate/.github/workflows/slop-gate.yml@v1
#
# It checks only what the PR changed, posts one report comment that it updates
# on every push, and fails the job when any finding is an error. It never
# commits to the PR branch: the PR author stays the only writer.
name: slop-gate

on:
  workflow_call:
    inputs:
      slop-gate-ref:
        description: >-
          Override for the slop-gate commit whose scripts run. Leave it empty: with
          `actions: read` granted, the workflow finds the commit your `uses:` line
          resolved to.
        type: string
        default: ""
      comment:
        description: Post or update the report as a PR comment (needs pull-requests write).
        type: boolean
        default: true
      strip-attribution-footer:
        description: >-
          Delete tool attribution footers from the PR description before checking
          it (needs pull-requests write). For agents that add a footer you can't
          turn off. Skipped on fork PRs.
        type: boolean
        default: false
      scan-secrets:
        description: >-
          Fail when a commit the PR adds contains a credential (gitleaks, values
          redacted in the log). Tune with .gitleaks.toml or .gitleaksignore.
        type: boolean
        default: true

env:
  VALE_VERSION: "3.25.1"
  BIOME_VERSION: "2.6.3"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # Finds the slop-gate commit this workflow was called at, for the checkout below.
  # It has no permissions key on purpose: it gets the caller's grant, so it can read
  # the run when the caller allows `actions: read`, and callers that don't still run.
  ref:
    name: slop-gate version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Check out the resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikejmckinney/slop-gate
          # A fixed commit that has the resolver, so any slop-gate-ref works, even one
          # from before the resolver existed. Move it when slopgate/resolve_ref.py changes.
          ref: 155dfb1d9eac16ed68a355175127c9d3035c28d6
          path: .slop-gate
          sparse-checkout: slopgate/resolve_ref.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SLOP_GATE_REF: ${{ inputs.slop-gate-ref }}
        run: python3 -I .slop-gate/slopgate/resolve_ref.py slop-gate.yml

  slop-gate:
    name: slop-gate
    needs: ref
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out slop-gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikejmckinney/slop-gate
          ref: ${{ needs.ref.outputs.ref }}
          path: .slop-gate
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Scan for credentials
        id: secrets
        if: inputs.scan-secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          .slop-gate/scripts/scan-secrets.sh "$BASE_SHA" "$HEAD_SHA"
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Install tools
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # ffmpeg is a 150 MB download; skip it when no audio changed.
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -qiE '\.(wav|mp3|ogg|oga|opus|flac|m4a|aac)$'; then
            export NEED_FFMPEG=1
          else
            export NEED_FFMPEG=0
          fi
          .slop-gate/scripts/install-tools.sh

      - name: Strip attribution footer
        if: inputs.strip-attribution-footer && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: .slop-gate/scripts/strip-footer.sh "$RUNNER_TEMP/pr-body.md"

      - name: Run checks
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The strip step leaves the current description here; otherwise use the event's.
          [ -f "$RUNNER_TEMP/pr-body.md" ] || printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          set +e
          PYTHONPATH=.slop-gate python -m slopgate check \
            --repo . --base "$BASE_SHA" --head "$HEAD_SHA" \
            --pr-title "$PR_TITLE" --pr-body-file "$RUNNER_TEMP/pr-body.md" \
            --report-md "$RUNNER_TEMP/slop-gate.md" --report-json "$RUNNER_TEMP/slop-gate.json" \
            --github
          echo "code=$?" >> "$GITHUB_OUTPUT"
          if [ -f "$RUNNER_TEMP/slop-gate.md" ]; then
            cat "$RUNNER_TEMP/slop-gate.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post report comment
        if: inputs.comment && always() && steps.check.outputs.code != '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          CODE: ${{ steps.check.outputs.code }}
        run: .slop-gate/scripts/post-comment.sh "$RUNNER_TEMP/slop-gate.md"

      - name: Upload findings
        if: always() && steps.check.outputs.code != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slop-gate-findings
          path: ${{ runner.temp }}/slop-gate.json
          if-no-files-found: ignore

      - name: Gate
        env:
          CODE: ${{ steps.check.outputs.code }}
          SECRETS: ${{ steps.secrets.outputs.code }}
        run: |
          case "$SECRETS" in
            "" | 0) ;;
            1) echo "::error::Credentials found in this PR's commits. The job summary lists each one; rotate them."; exit 1 ;;
            *) echo "::error::The credential scan could not run (exit $SECRETS). See the 'Scan for credentials' step."; exit 1 ;;
          esac
          case "$CODE" in
            0) echo "No blocking findings." ;;
            1) echo "::error::slop-gate found blocking issues. The report comment and job summary list each one with a fix."; exit 1 ;;
            *) echo "::error::slop-gate could not run (exit $CODE). See the 'Run checks' step."; exit 1 ;;
          esac
