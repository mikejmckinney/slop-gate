# slop-gate's own CI: unit tests, then the gate, audit and judge actions run
# against this repo's PRs using the code from the PR itself.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read

env:
  VALE_VERSION: "3.25.1"
  BIOME_VERSION: "2.6.3"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: tests read the resolver at the commit the workflows pin.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install tools
        run: scripts/install-tools.sh
      - name: Lint
        run: |
          ruff check slopgate tests
          ruff format --check slopgate tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  # The jobs below run this PR's own actions through `uses: ./`, so a change to
  # an action.yml or a script is exercised before it can reach `v1`. The names
  # keep the check names the branch ruleset requires.
  gate:
    name: gate / slop-gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          strip-attribution-footer: true

  # Audits the whole repo on every change. It reads only the working tree, so
  # a shallow checkout is enough.
  audit:
    name: audit / slop-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./audit
        with:
          fail-on-errors: true

  # Advisory vision review; runs only when the PR has the slop-judge label.
  judge:
    name: judge / slop-judge
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'slop-judge')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./judge
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
