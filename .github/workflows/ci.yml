# slop-gate's own CI: unit tests, then the gate run against this repo's PRs
# using the code from the PR itself.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read

env:
  VALE_VERSION: "3.25.1"
  BIOME_VERSION: "2.6.3"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install tools
        run: scripts/install-tools.sh
      - name: Lint
        run: |
          ruff check slopgate tests
          ruff format --check slopgate tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  gate:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/slop-gate.yml
    with:
      slop-gate-ref: ${{ github.event.pull_request.head.sha }}

  # Advisory vision review; runs only when the PR has the slop-judge label.
  judge:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'slop-judge')
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/slop-judge.yml
    with:
      slop-gate-ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
