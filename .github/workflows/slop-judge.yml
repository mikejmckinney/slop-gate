# Reusable advisory model review of the images and audio a PR changes. It posts its own
# comment and never fails on findings; it fails only when it cannot run.
# Consumers call it when a PR carries the `slop-judge` label:
#
#   slop-judge:
#     if: contains(github.event.pull_request.labels.*.name, 'slop-judge')
#     uses: mikejmckinney/slop-gate/.github/workflows/slop-judge.yml@v1
#     secrets:
#       OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
name: slop-judge

on:
  workflow_call:
    inputs:
      slop-gate-ref:
        description: >-
          Override for the slop-gate commit whose scripts run. Leave it empty: with
          `actions: read` granted, the workflow finds the commit your `uses:` line
          resolved to.
        type: string
        default: ""
    secrets:
      OPENROUTER_API_KEY:
        required: false

jobs:
  # Finds the slop-gate commit this workflow was called at, for the checkout below.
  # It has no permissions key on purpose: it gets the caller's grant, so it can read
  # the run when the caller allows `actions: read`, and callers that don't still run.
  ref:
    name: slop-gate version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Check out the resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikejmckinney/slop-gate
          ref: ${{ inputs.slop-gate-ref || 'v1' }}
          path: .slop-gate
          sparse-checkout: slopgate/resolve_ref.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SLOP_GATE_REF: ${{ inputs.slop-gate-ref }}
        run: python3 -I .slop-gate/slopgate/resolve_ref.py slop-judge.yml

  judge:
    name: slop-judge
    needs: ref
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for the API key
        id: key
        env:
          KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::slop-judge skipped: no OPENROUTER_API_KEY secret (fork PRs never get one)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the PR head
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out slop-gate
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mikejmckinney/slop-gate
          ref: ${{ needs.ref.outputs.ref }}
          path: .slop-gate
          persist-credentials: false

      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # The listening review converts audio with ffmpeg; skip the install when it is there.
      - name: Install ffmpeg
        if: steps.key.outputs.present == 'true'
        run: |
          if command -v ffmpeg >/dev/null; then exit 0; fi
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          timeout 300 sudo apt-get "${apt_opts[@]}" update -q
          timeout 420 sudo apt-get "${apt_opts[@]}" install -y -q --no-install-recommends ffmpeg

      - name: Review changed images and audio
        if: steps.key.outputs.present == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m pip install --disable-pip-version-check --progress-bar off -r .slop-gate/requirements.txt
          PYTHONPATH=.slop-gate python -m slopgate judge --repo . --base "$BASE_SHA" --head "$HEAD_SHA" \
            --report-md "$RUNNER_TEMP/slop-judge.md" > /dev/null
          cat "$RUNNER_TEMP/slop-judge.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post review comment
        if: steps.key.outputs.present == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MARKER: "<!-- slop-judge-report -->"
        run: .slop-gate/scripts/post-comment.sh "$RUNNER_TEMP/slop-judge.md"
