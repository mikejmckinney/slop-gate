# slop-gate's own use of the footer action, at the commit being run, so changes
# here are exercised on this repo's own comments and issues.
name: footer

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      apply:
        description: "Edit every PR description, issue body and comment with a footer (off: count only)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  footer:
    name: footer / slop-footer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # A local action needs the repo on disk; consumers calling
      # mikejmckinney/slop-gate/footer@v1 skip this step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./footer
        with:
          apply: ${{ inputs.apply || false }}
