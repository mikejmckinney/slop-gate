# slop-gate's own use of slop-footer.yml, at the commit being run, so changes
# here are exercised on this repo's own comments and issues.
name: footer

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      apply:
        description: "Edit every PR description, issue body and comment with a footer (off: count only)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  footer:
    uses: ./.github/workflows/slop-footer.yml
    with:
      slop-gate-ref: ${{ github.sha }}
      apply: ${{ inputs.apply || false }}
